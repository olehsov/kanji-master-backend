services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    restart: always
    environment:
      - POSTGRES_PASSWORD=kanji-master
      - POSTGRES_USER=kanji-master
      - POSTGRES_DB=kanji-master
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanji-master"]
      interval: 5s
      retries: 10
  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=kanji-master
      - DB_USER=kanji-master
      - DB_PASSWORD=kanji-master
      - APP_PORT=8080
      - KANJI_AI_PROVIDER=${KANJI_AI_PROVIDER:-stub}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_TOKEN=${OPENAI_API_TOKEN:-}

spring:
  jpa:
    database: POSTGRESQL
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 500
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: true
    hibernate:
      ddl-auto: validate
  application:
    name: kanji-master
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kanji-master}
    username: ${DB_USER:kanji-master}
    password: ${DB_PASSWORD:kanji-master}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      platform: postgres
  graphql:
    graphiql:
      enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_TOKEN}
      base-url: https://api.openai.com/
      chat:
        options:
          model: gpt-4o
          response-format:
            type: JSON_SCHEMA
            name: JapaneseTaskBuilder
            schema: >
              {
                "type": "object",
                "properties": {
                  "formation": {
                    "type": "string",
                    "description": "Formation of specific Japanese grammar topic. Prettify by using html"
                  },
                  "exampleSentences": {
                    "type": "array",
                    "description": "Example sentences in specific Japanese grammar topic.",
                    "items": {
                      "type": "object",
                      "properties": {
                        "sentence": {
                          "type": "string",
                          "description": "Example sentence in specific Japanese grammar topic"
                        },
                        "translation": {
                          "type": "string",
                          "description": "Translation of the sentence"
                        }
                      },
                      "required": [
                        "sentence",
                        "translation"
                      ],
                      "additionalProperties": false
                    }
                  },
                  "tasks": {
                    "type": "array",
                    "description": "A collection of language tasks relevant to the topic.",
                    "items": {
                      "type": "object",
                      "properties": {
                        "taskType": {
                          "type": "string",
                          "description": "The type of task to be performed.",
                          "enum": [
                            "CONVERT_TO_FORMATION",
                            "TRANSLATE_TO_JAPANESE",
                            "FILL_IN_THE_BLANKS"
                          ]
                        },
                        "description": {
                          "type": "string",
                          "description": "A brief description of the task. Should be in English"
                        },
                        "question": {
                          "type": "string",
                          "description": "A question that relate its type."
                        },
                        "correctAnswer": {
                          "type": "string",
                          "description": "A correct answer to the question."
                        },
                        "resources": {
                          "type": "array",
                          "description": "Links or materials that can assist with the task.",
                          "items": {
                            "type": "string"
                          }
                        }
                      },
                      "required": [
                        "taskType",
                        "description",
                        "question",
                        "correctAnswer",
                        "resources"
                      ],
                      "additionalProperties": false
                    }
                  }
                },
                "required": [
                  "formation",
                  "exampleSentences",
                  "tasks"
                ],
                "additionalProperties": false
              }
      chat-transcript-audio:
        options:
          model: 'whisper-1'
          response-format:
            type: JSON_SCHEMA
            name: JapaneseTranscriptBuilder
            schema: >
              {
                "type": "object",
                "properties": {
                  "lyric": {
                    "type": "string",
                    "description": "The lyrics from the audio, plain text "
                  },
                  "slices": {
                    "type": "array",
                    "description": "The 10 second subtitle slices of lyric",
                    "items": {
                      "type": "object",
                      "properties": {
                        "kanjies": {
                          "type": "array",
                          "description": "The kanjies from the slice"
                        },
                        "text": {
                          "type": "string",
                          "description": "The plain text of the slice"
                        },
                        "textHiragana": {
                          "type": "string",
                          "description": "The plain text of the slice in hiragana"
                        },
                        "startTime": {
                          "type": "string",
                          "description": "The start time of the slice in following format mm:ss:ms"
                        },
                        "endTime": {
                          "type": "string",
                          "description": "The end time of the slice in following format mm:ss:ms"
                        },
                        "details": {
                          "type": "array",
                          "description": "The words and phrases the slice consists of",
                          "items": {
                            "type": "object",
                            "properties": {
                              "text": {
                                "type": "string",
                                "description": "The word or phrase the slice consists of"
                              },
                              "textHiragana": {
                                "type": "string",
                                "description": "The word or phrase the slice consists of. In hiragana"
                              },
                              "meaning": {
                                "type": "string",
                                "description": "The word or phrase means"
                              },
                              "isWord": {
                                "type": "boolean",
                                "description": "Is it word"
                              },
                              "jlpt": {
                                "type": "string",
                                "description": "JLPT score from N1 to N5"
                              }
                            },
                            "required": [
                              "text",
                              "textHiragana",
                              "meaning",
                              "isWord",
                              "jlpt"
                            ],
                            "additionalProperties": false
                          }
                        },
                        "grammars": {
                          "type": "array",
                          "description": "The grammars used in the the slice",
                          "items": {
                            "type": "object",
                            "properties": {
                              "name": {
                                "type": "string",
                                "description": "The grammar name"
                              },
                              "explanation": {
                                "type": "string",
                                "description": "Short explanation of the grammar"
                              },
                              "example": {
                                "type": "string",
                                "description": "Example of the grammar"
                              }
                            }
                          },
                          "required": [
                            "name",
                            "explanation",
                            "example"
                          ],
                          "additionalProperties": false
                        },
                        "required": [
                          "kanjies",
                          "text",
                          "textHiragana",
                          "type",
                          "endTime",
                          "details",
                          "grammars"
                        ],
                        "additionalProperties": false
                      }
                    }
                  },
                  "required": [
                    "formation",
                    "exampleSentences",
                    "tasks"
                  ],
                  "additionalProperties": false
                }
              }

  servlet.multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  main:
    allow-circular-references: true

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.web.client: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    org.apache.http: DEBUG
    org.apache.http.wire: DEBUG
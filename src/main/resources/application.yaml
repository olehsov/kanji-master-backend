spring:
  jpa:
    database: POSTGRESQL
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 500
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: true
    hibernate:
      ddl-auto: validate
  application:
    name: kanji-master
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kanji-master}
    username: ${DB_USER:kanji-master}
    password: ${DB_PASSWORD:kanji-master}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      platform: postgres
  graphql:
    graphiql:
      enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_TOKEN}
      base-url: https://api.openai.com/
      chat:
        options:
          model: gpt-4o
          response-format:
            type: JSON_SCHEMA
            name: JapaneseTaskBuilder
            schema: >
              {
                "type": "object",
                "properties": {
                  "formation": {
                    "type": "string",
                    "description": "Formation of specific Japanese grammar topic. Prettify by using html"
                  },
                  "exampleSentences": {
                    "type": "array",
                    "description": "Example sentences in specific Japanese grammar topic.",
                    "items": {
                      "type": "object",
                      "properties": {
                        "sentence": {
                          "type": "string",
                          "description": "Example sentence in specific Japanese grammar topic"
                        },
                        "translation": {
                          "type": "string",
                          "description": "Translation of the sentence"
                        }
                      },
                      "required": [
                        "sentence",
                        "translation"
                      ],
                      "additionalProperties": false
                    }
                  },
                  "tasks": {
                    "type": "array",
                    "description": "A collection of language tasks relevant to the topic.",
                    "items": {
                      "type": "object",
                      "properties": {
                        "taskType": {
                          "type": "string",
                          "description": "The type of task to be performed.",
                          "enum": [
                            "CONVERT_TO_FORMATION",
                            "TRANSLATE_TO_JAPANESE",
                            "FILL_IN_THE_BLANKS"
                          ]
                        },
                        "description": {
                          "type": "string",
                          "description": "A brief description of the task. Should be in English"
                        },
                        "question": {
                          "type": "string",
                          "description": "A question that relate its type."
                        },
                        "correctAnswer": {
                          "type": "string",
                          "description": "A correct answer to the question."
                        },
                        "resources": {
                          "type": "array",
                          "description": "Links or materials that can assist with the task.",
                          "items": {
                            "type": "string"
                          }
                        }
                      },
                      "required": [
                        "taskType",
                        "description",
                        "question",
                        "correctAnswer",
                        "resources"
                      ],
                      "additionalProperties": false
                    }
                  }
                },
                "required": [
                  "formation",
                  "exampleSentences",
                  "tasks"
                ],
                "additionalProperties": false
              }
      chat-transcript-audio:
        options:
          model: 'whisper-1'

      chat-subtitle:
        options:
          model: gpt-4o
          response-format:
            type: JSON_SCHEMA
            name: JapaneseTranscriptBuilder
            schema: >
              {
                  "type": "object",
                  "properties": {
                    "subtitles": {
                      "type": "array",
                      "description": "List of subtitle lines with timing and translations.",
                      "items": {
                        "type": "object",
                        "properties": {
                          "index": {
                            "type": "integer",
                            "description": "The sequential index of the subtitle line."
                          },
                          "timingStart": {
                            "type": "string",
                            "description": "The start timing of the subtitle in the format 'HH:MM:SS,MS'."
                          },
                          "timingEnd": {
                            "type": "string",
                            "description": "The end timing of the subtitle in the format 'HH:MM:SS,MS'."
                          },
                          "line": {
                            "type": "string",
                            "description": "The original subtitle line in Japanese."
                          },
                          "translation": {
                            "type": "string",
                            "description": "The complete translation of the line in Ukrainian."
                          },
                          "kanjies": {
                            "type": "string",
                            "description": "List of kanji that used in the subtitle, joined by coma"
                          },
                          "grammars": {
                            "type": "string",
                            "description": "List of grammars that used in the subtitle, joined by coma"
                          },
                          "individualTranslations": {
                            "type": "array",
                            "description": "Translations of each kanji or phrase used in the line.",
                            "items": {
                              "type": "object",
                              "properties": {
                                "text": {
                                  "type": "string",
                                  "description": "The word or phrase"
                                },
                                "textHiragana": {
                                  "type": "string",
                                  "description": "The word or phrase in Hiragana"
                                },
                                "meaning": {
                                  "type": "string",
                                  "description": "Meaning of the word or phrase"
                                },
                                "isWord": {
                                  "type": "boolean",
                                  "description": "Is it word"
                                },
                                "jlpt": {
                                  "type": "string",
                                  "description": "JLPT score from N1 to N5"
                                }
                              },
                              "required": [
                                "text",
                                "textHiragana",
                                "meaning",
                                "isWord",
                                "jlpt"
                              ],
                              "additionalProperties": false
                            }
                          }
                        },
                        "required": [
                          "index",
                          "timingStart",
                          "timingEnd",
                          "line",
                          "translation",
                          "kanjies",
                          "grammars",
                          "individualTranslations"
                        ],
                        "additionalProperties": false
                      }
                    }
                  },
                  "required": [
                    "subtitles"
                  ],
                  "additionalProperties": false
                }
  servlet.multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  main:
    allow-circular-references: true

server:
  port: ${APP_PORT:8080}

logging:
  level:
    org.springframework.web.client: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    org.apache.http: DEBUG
    org.apache.http.wire: DEBUG

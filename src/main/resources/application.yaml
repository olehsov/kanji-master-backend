spring:
  application:
    name: kanji-master
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kanji-master}
    username: ${DB_USER:kanji-master}
    password: ${DB_PASSWORD:kanji-master}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  flyway:
    # Production schema predates Flyway on the classpath: mark it as V15 once, then run V16+ automatically.
    baseline-on-migrate: true
    baseline-version: 15
  graphql:
    graphiql:
      enabled: ${KANJI_DOCS_ENABLED:true}
    schema:
      printer:
        enabled: ${KANJI_DOCS_ENABLED:true}

server:
  port: ${APP_PORT:8080}

springdoc:
  api-docs:
    enabled: ${KANJI_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${KANJI_DOCS_ENABLED:true}
    path: /swagger-ui.html

kanji:
  cors:
    allowed-origins:
      - http://localhost:4200
      - https://kanji-master-frontend-2sumyipbsq-uc.a.run.app
      - https://kanji-master-frontend-695666739311.europe-west1.run.app
  ai:
    # stub (default): fixed demo responses, no external calls | claude | openai (deprecated)
    provider: ${KANJI_AI_PROVIDER:stub}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${KANJI_AI_CLAUDE_MODEL:claude-haiku-5-5}
    openai:
      # Used for Whisper audio transcription whenever provider is not stub
      api-key: ${OPENAI_API_TOKEN:}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
logging:
  level:
    org.springframework.web.client: DEBUG
